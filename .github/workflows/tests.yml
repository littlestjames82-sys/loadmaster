name: Tests

# Runs the full pytest suite on every push and pull request, so the
# test count the README claims is verifiable from the Actions tab.

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt httpx httpx2
      - run: python -m pytest tests/ -q
